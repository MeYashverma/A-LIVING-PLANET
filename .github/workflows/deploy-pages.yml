name: Deploy to GitHub Pages

# Builds the app and publishes it to GitHub Pages. The site is a static bundle:
# all world generation, simulation and rendering happen in the browser, and the
# textures in public/assets are copied verbatim, so there is nothing to configure
# server-side.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so a deploy that
# is already serving traffic is not interrupted mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      # Uploaded before Pages is configured on purpose: a repository that has not
      # switched Pages on yet still gets a working, downloadable site out of
      # every successful build, rather than losing the artifact to a later step's
      # permission error.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Pages has to be enabled by a repository admin, once. A token issued to a
      # workflow cannot do it, so check for it and say so plainly instead of
      # failing three steps later with a stack trace.
      - name: Verify the built site resolves under a project subdirectory
        run: node tools/check-pages.mjs

      - name: Check that Pages is enabled
        # Advisory: a false negative here would block a deploy that would have
        # worked, so the real gate stays configure-pages below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled for this repository::Open Settings → Pages, set Source to \"GitHub Actions\", then re-run this workflow. The built site is attached to this run as an artifact in the meantime."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
